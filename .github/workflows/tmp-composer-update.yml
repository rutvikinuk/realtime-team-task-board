name: tmp-composer-update
on: workflow_dispatch
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: composer update league/commonmark symfony/http-foundation symfony/mime --with-dependencies --no-interaction --no-scripts --no-progress
      - run: composer audit --locked --no-interaction
      - run: |
          git config user.name 'Rutvik Patel'
          git config user.email 'patelrutvikn@gmail.com'
          git add composer.lock
          git commit -m "Update vulnerable composer dependencies (league/commonmark, symfony/http-foundation, symfony/mime)"
          git push origin HEAD:main
